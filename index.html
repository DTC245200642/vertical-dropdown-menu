<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Trình đơn Dropdown Dọc</title>
    <style type="text/css">
     
        html, body, h1, h2, h3, h4, ul, ol, li, p, a {
            padding: 0;
            border: 0;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #menu {
            margin: 50px;
        }

        
        #menu ul {
            list-style: none; 
        }

        #menu li {
            list-style: none;
            position: relative; 
            width: 160px;
            height: 30px;
            padding: 0 20px; 
            background-color: black;
            line-height: 30px; 
            cursor: pointer; 
            margin-bottom: 2px;
        }

     
        #menu a {
            text-decoration: none; 
            color: white; 
            display: block;
        }

        #menu li:hover {
            background-color: #444;
        }

      
        #menu li ul {
            position: absolute; 
            top: 0;
            left: 160px; 
            visibility: hidden; 
        }

      
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm &raquo;</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ &raquo;</a>
                <ul>
                    <li><a href="#">Thiết kế web</a></li>
                    <li><a href="#">Lập trình App</a></li>
                    <li><a href="#">SEO Marketing</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
